rows:
  # Appendix 9: roles
  - ref: dcra
    element: ap9-pep
    counterpart: "The read path's enforcement point, and the egress gate"
    correspondence: corresponds
    evidence: [ADR-0029, ADR-0043]
    note: >-
      An enforcement point gathers the attributes, asks the decision point, and applies the answer. It has no access
      logic of its own. The read path's enforcement point is built (ADR-0029, slice 1). The egress gate is a
      compiled predicate that asks the decision point once at startup. It is built and measured under compose, and
      is not deployed (ADR-0043).
  - ref: dcra
    element: ap9-pdp
    counterpart: "One policy engine, with a replica at each tier"
    correspondence: corresponds
    evidence: [ADR-0029, ADR-0045, ADR-0055]
    note: >-
      One decision point, a policy engine. Each tier has its own replica, so a severed tier still decides (ADR-0045,
      partly built). Per-viewer admitted keys are ADR-0055, design only. ADR-0043 treats an unavailable decision
      point as an error, not as a deny.
  - ref: dcra
    element: ap9-pip
    counterpart: "The viewer's token claims and the record's stamped label"
    correspondence: partial
    evidence: [ADR-0029, ADR-0045]
    note: >-
      The attributes come from two places: the viewer's token claims (asserted entitlements, ADR-0029 §5) and the
      label stamped on the record at ingress. No separate information point is queried at decision time, and there
      are no device or network-posture attributes.
  - ref: dcra
    element: ap9-pap
    counterpart: "Policies and entitlements as versioned declarations"
    correspondence: partial
    evidence: [ADR-0029, ADR-0055]
    note: >-
      Policies and entitlements are declarations under version control, and each deployment declares its policy
      identifier (ADR-0055 §6). There is no administration service: a change is a reviewed commit and a redeploy.
  # Appendix 9: services
  - ref: dcra
    element: ap9-crypto
    correspondence: none
    evidence: [ADR-0061]
    note: >-
      Data is not encrypted or signed per record. A signed binding of a label to its data is designed and not
      built (ADR-0061 §6).
    owed: ADR-0061
  - ref: dcra
    element: ap9-authz
    counterpart: "The decision point and the enforcement points"
    correspondence: corresponds
    evidence: [ADR-0029]
    note: "Authorization and access control is the decision point and enforcement points above."
  - ref: dcra
    element: ap9-authn
    counterpart: "OIDC sign-in against an identity realm at each tier"
    correspondence: corresponds
    evidence: [ADR-0029, ADR-0045]
    note: >-
      Sign-in uses OIDC against an identity realm at each tier, with trust between tiers (ADR-0045, partly built).
  - ref: dcra
    element: ap9-certs
    correspondence: none
    note: "No decision record covers a certificate service. Transport TLS is part of the deployment, and is not data-centric."
  - ref: dcra
    element: ap9-identity
    counterpart: "Each person's home tier, from the system of record's assignment"
    correspondence: partial
    evidence: [ADR-0045]
    note: >-
      Each person has a home tier, which follows the system of record's assignment. No record covers the identity
      lifecycle (creation to deactivation).
  # Appendix 10
  - {ref: dcra, element: ap10-team, correspondence: not-applicable, note: "An organisational role, not a property of the software."}
  - ref: dcra
    element: ap10-dqms
    counterpart: "Detection of lost feeds, stale data and degraded modes"
    correspondence: partial
    evidence: [ADR-0036]
    note: >-
      Lost feeds, stale data and degraded modes are detected and shown, and ADR-0036 keeps a register of the failure
      modes that have no detection yet. Accuracy and completeness are not measured as quality dimensions.
  - {ref: dcra, element: ap10-poisoned, correspondence: none, note: "There is no catalogue, so there is no flag and no proxy that acts on one."}
  - {ref: dcra, element: ap10-iso8000, correspondence: none, note: "No decision record maps to ISO 8000-61."}
  # Core metadata: the gaps
  - ref: dcra
    element: md-4774
    counterpart: "The label's originator, releasability and lifecycle fields"
    correspondence: partial
    evidence: [ADR-0029, ADR-0043, ADR-0055, ADR-0061]
    note: >-
      The 4774 concepts are carried: originator and releasability on the wire (ADR-0043), and lifecycle times
      (ADR-0055). The 4774 encoding is not. A 4774 label is XML only, and generating it from the JSON Schema
      source is designed, not built (ADR-0061, finding 1 and §7). This is a gap.
    owed: ADR-0061
  - ref: dcra
    element: md-4778
    correspondence: none
    evidence: [ADR-0061]
    note: >-
      Designed, not built (ADR-0061 §6). A binding that leaves the domain is a 4778.2 binding data object, and it is
      signed when the deployment declares the binding cryptographic.
    owed: ADR-0061
  - ref: dcra
    element: md-dcat
    correspondence: none
    evidence: [ADR-0056]
    note: "Named in ADR-0056's standards table as concept only, for data products and their terms, later. This is a gap."
    owed: ADR-0056
  - ref: dcra
    element: a2-interface-policy
    counterpart: "The enforcement points on reads and on egress"
    correspondence: partial
    evidence: [ADR-0029, ADR-0043]
    note: >-
      Reads and egress both pass an enforcement point that applies the label. Terms of use, obfuscation and masking
      are not enforced.

  # DoD Data Mesh Reference Architecture: the 15 services. Draft judgments; services 2 and 4 are not yet assessed.
  - ref: dmra
    element: dmra-01
    counterpart: "One identity per thing, minted once"
    correspondence: partial
    evidence: [ADR-0056]
    note: "Identity covers the things this project tracks, not every object in an enterprise."
  - {ref: dmra, element: dmra-02, correspondence: not_assessed}
  - ref: dmra
    element: dmra-03
    correspondence: none
    evidence: [ADR-0056]
    note: "There is no catalogue. ADR-0056 names catalogue metadata (DCAT) as a concept only, for later."
    owed: ADR-0056
  - {ref: dmra, element: dmra-04, correspondence: not_assessed}
  - ref: dmra
    element: dmra-05
    counterpart: "The decision point and the enforcement points"
    correspondence: corresponds
    evidence: [ADR-0029]
    note: "Access to a record is decided from the viewer's asserted attributes and the record's label."
  - ref: dmra
    element: dmra-06
    counterpart: "Policies and entitlements as versioned declarations"
    correspondence: partial
    evidence: [ADR-0055]
    note: "There is no administration service: a change is a reviewed commit and a redeploy."
  - ref: dmra
    element: dmra-07
    counterpart: "The read path, through its enforcement point"
    correspondence: partial
    evidence: [ADR-0029]
    note: "Requests are filtered by label on the way through. They are not routed between services."
  - {ref: dmra, element: dmra-08, correspondence: none, note: "There is no search over data products."}
  - ref: dmra
    element: dmra-09
    counterpart: "The Redpanda bus, with a broker per edge"
    correspondence: corresponds
    evidence: [ADR-0022, ADR-0024]
    note: "ADR-0022 chose Redpanda as the architecture's bus. ADR-0024's aggregation pattern is built on it."
  - ref: dmra
    element: dmra-10
    counterpart: "Detection of lost feeds, stale data and degraded modes"
    correspondence: partial
    evidence: [ADR-0036]
    note: "It watches the system's health. How data is used is not tracked."
  - {ref: dmra, element: dmra-11, correspondence: none, note: "There are no data products to register, revoke or recall."}
  - ref: dmra
    element: dmra-12
    counterpart: "A label stamped on every record at ingress, compiled to one key"
    correspondence: partial
    evidence: [ADR-0029, ADR-0055, ADR-0061]
    note: "Labels are applied and enforced. Their STANAG 4774 encoding is designed, not built (ADR-0061)."
  - ref: dmra
    element: dmra-13
    counterpart: "Stale and degraded data is marked as such"
    correspondence: partial
    evidence: [ADR-0036]
    note: "Accuracy and completeness are not measured as quality dimensions."
  - ref: dmra
    element: dmra-14
    counterpart: "An ingestion sidecar per external feed, translating it to the internal schema"
    correspondence: partial
    evidence: [ADR-0010]
    note: "Translation is from each external feed inward, not from one producer to each consumer's domain."
  - ref: dmra
    element: dmra-15
    counterpart: "Health signals from the system's own components"
    correspondence: partial
    evidence: [ADR-0036]
    note: "The signals are for detecting failures, not for weighing performance or value."
