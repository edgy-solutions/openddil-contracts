# Alignment record: this project against the NATO Data Centric Reference Architecture, Version 2.
#
# DRAFT. It is written in the format proposed in arch-kit's docs/design/alignment.md. That format is proposed, not
# built, so nothing renders or checks this file yet. Element names are the reference's own. Every note is this
# project's paraphrase. The record cites by appendix and paragraph and carries no passages and no figures.

title: Data-centric security, labels and data quality, against the NATO DCRA v2
status: draft
context: |
  This project does not cite the DCRA anywhere in its decision records today. This record is its first citation.

  Where the model is attribute-based, and where it is not:
  - It is attribute-based in the decision. Access to a record is decided by one policy engine, from the viewer's
    asserted attributes (nation, clearance, role) and the record's label. It is not decided by which screen the
    viewer opened (ADR-0029).
  - It is not attribute-based per request. A label is compiled to one key when it is stamped (ADR-0055 §2). The
    decision point evaluates each distinct label once per viewer and returns the keys that viewer is admitted to.
    The enforcement point then filters by set membership, `label_key IN (admitted)`. So a read tests membership in
    a set decided earlier; the attributes are not evaluated again on every read.
  - So a change takes effect when the set is recomputed, not on the next read. That holds for a change to a
    viewer's attributes, and for a change to a record's label, which is a new key. ADR-0055 records what a new key
    costs, and that the cost of recomputing has not been measured.
  - Environment attributes such as time, device or location are not inputs today.

