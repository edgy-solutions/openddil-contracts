# Fictional overlay for the data-exchange generator tests. Nations ATL and BDR,
# one made-up destination, one made-up kind. Attests nothing about any real
# deployment.
releasability:
  enabled: true
  destinations:
    version: "example-1"
    entries:
      "system:depot-ledger":
        display_name: "Depot ledger"
        nations: [ATL, BDR]
        accepts: [FaultEvent]
        asserted_by: "example-registry"
        asserted_on: "2026-01-01"

egress:
  hubTopics:
    - "egress-depot-faults|-p 8 -r 1 -c cleanup.policy=compact"
  kinds:
    FaultEvent:
      $schema: "https://json-schema.org/draft/2020-12/schema"
      title: FaultEvent
      type: object
      x-openddil:
        key: /picture/event_id
        label: /picture/label
        owning_tier: /picture/owning_tier
        trigger: /kind
      required: [kind, picture]
      properties:
        kind:
          type: string
          enum: [cm_discrepancy, lifecycle_transition]
        picture:
          type: object
          properties:
            event_id: {type: string}
            label: {type: object}
            owning_tier: {type: string}
  routes:
    - name: depot-faults
      source_topic: egress-depot-faults
      destination: "system:depot-ledger"
      sink_topic: egress-depot-sink
      kind: FaultEvent
  assembler:
    enabled: true
    config:
      - name: example-faults
        kind: FaultEvent
        trigger_topic: asset-cm-state
        output_topic: egress-depot-faults
  forwarder:
    enabled: true
    config:
      - name: depot-faults
        sink_topic: egress-depot-sink
        url: https://depot-ledger.example.invalid/records
        kind: FaultEvent
