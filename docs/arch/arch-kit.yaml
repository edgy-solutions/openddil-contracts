# Declares this repository's architecture content to the export kit. Paths are relative to this file.
kit: 1
paths:
  root: .                    # the architecture directory: views/, model/, profiles.yaml, slots.yaml, ...
  repo: ../..                # the repository root (git stamps run here)
  decisions: ../../decisions
name: OpenDDIL               # the framework's display name: attribution default, title strip
model:
  file: model/openddil.sysml # relative to paths.root
  package: OpenDDIL
exchange:
  annotations:
    produces: openddil.io/produces-topics
    groups: openddil.io/consumer-groups
  schema_key: x-openddil
registers:
  follow_ups: FOLLOW-UPS.md
  debt: GENERALIZATION-DEBT.md
  roadmap: ROADMAP-2026-10-29-isolation-increments.md
readiness:
  default: ../scripts/RECORDING-READINESS.md   # relative to the chart directory
portal:
  hosting: ci-artifact        # the workflow uploads the export as a build artifact
  audience: public             # a public repository: the render and check_export require the relabel and barred lists
loader: kit_loader.py        # the module that reads this repository's record, decisions, registers and readiness doc
labels:
  degraded_mode:
    heading: Severed behaviour     # the page heading, the table column, the derived table's lead sentence
    marker: severed-behaviour      # the generated-section marker: <!-- generated: MARKER -->
    attribute: data-severed        # the HTML attribute on the capability page's paragraph
    open_row_prefix: SV-           # a record row id with this prefix is the open row for "not stated"
  group:
    column: Lane                   # the capability-phases table column, and the column render_html styles
  phase:
    column: Phase                  # the phase column of the capability-phases table, and the column render_html badges
  environment:
    word: lab                      # "Lab X is ..., lab Y ..." and the evidence cell's "<date>, lab X, ..."
phases:                        # strongest first; a capability takes the first phase whose rule it meets
  - name: measured
    when: [measured]
    badge: m
  - name: built unmeasured
    when: [built]
    badge: b
  - name: accepted design
    when: [{status: Accepted}]
    badge: a
  - name: proposed
    when: [{status: Proposed}, still-open, pending]
    badge: p
  - name: row
    when: [rows]
    badge: r
floor: built unmeasured        # capability_floor: this phase and every phase above it count as built
statuses:
  - word: Accepted             # as the decision index and a Sources table's Decision column write it
    lead: accepted             # how a record's status line starts
    in_force: true             # derived: a record with this status must be cited, unless exempt
  - word: Proposed
    lead: proposed
    in_force: true
    sources_check: true        # check_views marks: a row marked with this word and its record's lead must agree
  - word: Superseded
    lead: superseded
    in_force: false
  - word: Rejected
    lead: rejected
    in_force: false
  - word: Deprecated
    lead: deprecated
    in_force: false
  - word: Withdrawn
    lead: withdrawn
    in_force: false
views:
  required: [Op-Cn, Rs-Sr, Rs-If, Sc-Sr, Sd-Tx, St-Rm-P, Rs-Tr]
  required_dodaf: [OV-1, OV-2, OV-5a, OV-5b, SV-1, SV-2, SV-4, SV-6, StdV-1, DIV-2, CV-2]
  homes:                       # generated-section name -> the view that holds it
    capability-phases: St-Rm-P
    dependencies: St-Cn
    taxonomy: Rs-Tx
    dictionary: Am-If
    trace: Am-Tr
    severed-behaviour: St-Tx   # keyed by the marker declared in labels.degraded_mode.marker
  capability_links: [St-Tx, St-Rm-P]   # views whose capability names link to their pages
export:
  browser:
    views:                             # the views the browser check opens, by the role it gives each
      table: Rs-Cn                     #   phone, zebra and screenshot checks; holds the widest table
      diagram: Op-Tx                   #   diagram screenshot, print and table-width checks
      profile_only: Sc-Sr              #   a view that has no export in one of the profiles
    search:
      phrase: Which resource talks to which   # typed into the search box
      finds: Rs-Cn                     # the view whose page holds that phrase
    min_pages: 30
    min_tables: 30
    min_tokens: 1000
decisions:
  index:
    register: FOLLOW-UPS.md              # the register index: one row per register id
    readme: README.md                    # the document index: every document is referenced here
    register_homes: [ADR-*.md, GENERALIZATION-DEBT.md]     # where register ids are declared, and their status tokens
    indexed: [ADR-*.md, AUDIT-*.md, PLAN-*.md, DESIGN-*.md, BRIEF-*.md,
              GENERALIZATION-DEBT.md, PRINCIPLES.md, FOLLOW-UPS.md, EXCHANGE-LEDGER.md]   # each must be in readme
    local_prefix: openddil               # a `local_prefix:ADR-NNNN` citation must resolve to a document here
    foreign:                             # other repositories this corpus cites, in order
      - prefix: iagent
        pin_check: scripts/check-iagent-citation-pins.sh   # repository-relative
derived:
  dictionary:
    dir: ontology                # relative to the repository root
    terms:                       # (file, path) pairs, in the order the table shows them
      - {file: asset_identity_aliases.yaml, path: aliases.dis}
      - {file: dis_appearance.yaml, path: populating_sources}
      - {file: dis_appearance.yaml, path: appearance}
      - {file: dis_condition.yaml, path: level_order}
      - {file: dis_condition.yaml, path: source_order}
      - {file: dis_condition.yaml, path: appearance}
      - {file: dis_condition.yaml, path: emission.populating_sources}
      - {file: dis_condition.yaml, path: emission.baselines}
      - {file: dis_condition.yaml, path: data_health}
      - {file: dis_entity_types.yaml, path: mappings}
      - {file: platform_reference.yaml, path: platforms}
      - {file: platform_variant_aliases.yaml, path: aliases.dis}
