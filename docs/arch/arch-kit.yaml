# Declares this repository's architecture content to the export kit. Paths are relative to this file.
kit: 1
paths:
  root: .                    # the architecture directory: views/, model/, profiles.yaml, slots.yaml, ...
  repo: ../..                # the repository root (git stamps run here)
  decisions: ../../decisions
name: OpenDDIL               # the framework's display name: attribution default, title strip
model:
  file: model/openddil.sysml # relative to paths.root
  package: OpenDDIL
exchange:
  annotations:
    produces: openddil.io/produces-topics
    groups: openddil.io/consumer-groups
  schema_key: x-openddil
registers:
  follow_ups: FOLLOW-UPS.md
  debt: GENERALIZATION-DEBT.md
  roadmap: ROADMAP-2026-10-29-isolation-increments.md
readiness:
  default: ../scripts/RECORDING-READINESS.md   # relative to the chart directory
loader: kit_loader.py        # the module that reads this repository's record, decisions, registers and readiness doc
