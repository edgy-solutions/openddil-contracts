syntax = "proto3";
package openddil.telemetry.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "openddil/common/v1/quantity.proto";

// =============================================================================
// CORE PRIMITIVES — used everywhere
// =============================================================================
//
// Quantity (value + UCUM unit) lives in openddil.common.v1; this package
// uses it via the import above. Field types are fully qualified so the
// resolver finds the import without ambiguity.

// A vector quantity — all components share one unit.
message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
  string unit = 4;
}

// A quaternion. Always dimensionless. Order: (w, x, y, z) with w as scalar.
message Quaternion {
  double w = 1;
  double x = 2;
  double y = 3;
  double z = 4;
}

// =============================================================================
// SPATIAL — position, velocity, attitude with explicit frames
// =============================================================================

// Earth-Centered Earth-Fixed (ECEF / WGS84 ellipsoid).
// Per ADR-0013: components are Quantity-typed; producers tag the unit they
// emit natively (UCUM `"m"` for canonical ECEF) and consumers convert lazily
// via pint. Clean break from the prior `x_m double` bare-field shape.
message EcefPosition {
  openddil.common.v1.Quantity x = 1;
  openddil.common.v1.Quantity y = 2;
  openddil.common.v1.Quantity z = 3;
}

// WGS84 geodetic. Lat/lon as Quantity (typical UCUM `"deg"`), altitude as
// Quantity with reference frame called out separately. Per ADR-0013.
message Wgs84Position {
  openddil.common.v1.Quantity lat = 1;
  openddil.common.v1.Quantity lon = 2;
  openddil.common.v1.Quantity alt = 3;
  AltitudeReference alt_ref = 4;
}

enum AltitudeReference {
  ALT_REF_UNSPECIFIED = 0;
  ALT_REF_WGS84_ELLIPSOID = 1;  // height above ellipsoid (HAE)
  ALT_REF_MSL_EGM2008 = 2;      // mean sea level via EGM2008 geoid
  ALT_REF_MSL_EGM96 = 3;
  ALT_REF_AGL = 4;              // above ground level (requires DEM)
  ALT_REF_BAROMETRIC = 5;       // pressure altitude, uncorrected
}

// Local tangent plane: East-North-Up. Components are Quantity-typed per
// ADR-0013 (typical UCUM `"m"`).
message LocalEnu {
  openddil.common.v1.Quantity east = 1;
  openddil.common.v1.Quantity north = 2;
  openddil.common.v1.Quantity up = 3;
  Wgs84Position origin = 4;
}

// Discriminated position. Producers SHOULD emit the frame native to the
// source; consumers convert lazily.
message Position {
  oneof frame {
    EcefPosition ecef = 1;
    Wgs84Position wgs84 = 2;
    LocalEnu local_enu = 3;
  }
  google.protobuf.Timestamp valid_at = 10;
  PositionQuality quality = 11;
}

message PositionQuality {
  // Horizontal/vertical 1-sigma uncertainty in meters. 0 = unknown.
  double horiz_std_m = 1;
  double vert_std_m = 2;
  PositionSource source = 3;
}

enum PositionSource {
  POS_SRC_UNSPECIFIED = 0;
  POS_SRC_GPS_L1 = 1;
  POS_SRC_GPS_RTK = 2;
  POS_SRC_GPS_PPP = 3;
  POS_SRC_INS = 4;          // pure inertial
  POS_SRC_GPS_INS = 5;      // tightly-coupled
  POS_SRC_DEAD_RECKON = 6;
  POS_SRC_OPERATOR = 7;     // human-entered
  POS_SRC_SIMULATED = 8;
}

// Velocity in a named frame. Convert lazily.
message Velocity {
  oneof frame {
    Vector3 ecef = 1;       // m/s in ECEF
    Vector3 ned = 2;        // m/s in local North-East-Down
    Vector3 body = 3;       // m/s in vehicle body frame
  }
  openddil.common.v1.Quantity ground_speed = 10;     // optional convenience scalar
  openddil.common.v1.Quantity course_over_ground = 11;  // bearing, "deg"
}

// Attitude — orientation of the platform body relative to a reference frame.
message Attitude {
  oneof representation {
    Quaternion quat = 1;            // body-to-NED by default
    EulerAngles euler = 2;
  }
  AttitudeReference reference = 10;
  // Per-axis 1-sigma uncertainty in degrees.
  Vector3 std_dev_deg = 11;
}

// Convention: ZYX intrinsic (yaw, pitch, roll). Per ADR-0013, each angle is
// Quantity-typed so the source's native unit (DIS emits `"rad"`; many UI
// systems emit `"deg"`) is preserved on the wire.
message EulerAngles {
  openddil.common.v1.Quantity yaw = 1;
  openddil.common.v1.Quantity pitch = 2;
  openddil.common.v1.Quantity roll = 3;
}

enum AttitudeReference {
  ATT_REF_UNSPECIFIED = 0;
  ATT_REF_BODY_TO_NED = 1;
  ATT_REF_BODY_TO_ECEF = 2;
  ATT_REF_BODY_TO_ENU = 3;
}

// =============================================================================
// KINEMATIC STATE — full motion picture for an asset at a moment
// =============================================================================

message KinematicState {
  Position position = 1;
  Velocity velocity = 2;
  Vector3 acceleration = 3;       // optional, m/s^2 in body frame
  Attitude attitude = 4;
  Vector3 angular_velocity = 5;   // optional, rad/s in body frame

  // Dead-reckoning hints from DIS PDU, if applicable.
  DeadReckoning dead_reckoning = 6;
}

message DeadReckoning {
  DeadReckoningAlgorithm algorithm = 1;
  google.protobuf.Duration max_age = 2;  // beyond this, extrapolation invalid
}

enum DeadReckoningAlgorithm {
  DR_UNSPECIFIED = 0;
  DR_STATIC = 1;
  DR_FPW = 2;   // Fixed, Position World
  DR_RPW = 3;   // Rotating, Position World
  DR_RVW = 4;   // Rotating, Velocity World
  DR_FVW = 5;   // Fixed, Velocity World
  DR_FPB = 6;   // Fixed, Position Body
  DR_RPB = 7;
  DR_RVB = 8;
  DR_FVB = 9;
}

// =============================================================================
// SUSTAINMENT — the logistics/maintenance side of the kinetic-logistics bridge
// =============================================================================

// Whether a sustainment value is a MEASURED observation or a DERIVED estimate
// (e.g. produced by the Phase 5 prognostics engine from kinematic history).
// Per ADR-0020 the validation phase distinguishes the two; Phase 5 is
// uniformly DERIVED — there is no measured-sustainment source yet.
enum Origin {
  ORIGIN_UNSPECIFIED = 0;
  ORIGIN_MEASURED    = 1;
  ORIGIN_DERIVED     = 2;
}

// Per-value provenance for a sustainment field. `confidence` is in [0.0, 1.0]
// for DERIVED values; Phase 5 emits a placeholder (0.0) — confidence gets
// real meaning at the validation phase per ADR-0020.
message ValueProvenance {
  Origin origin     = 1;
  float  confidence = 2;
}

message SustainmentMetrics {
  ThermalMetrics thermal = 1;
  PowerMetrics power = 2;
  FluidMetrics fluids = 3;
  ConsumablesMetrics consumables = 4;
  ComponentWearMetrics wear = 5;
  HealthFlags health = 6;

  // Per-value provenance map. Key = sustainment field path (e.g.
  // "wear.track.remaining_useful_life"). Special key "*" means "every
  // sustainment value in this message has this provenance" — Phase 5
  // populates ONLY the wildcard ("message-level") per ADR-0020; per-field
  // entries are forward-looking shape for the validation phase, where an
  // asset may mix MEASURED and DERIVED values. ADR-0013-style "shape it
  // right while it's cheap."
  map<string, ValueProvenance> value_provenance = 7;
}

message ThermalMetrics {
  // Use Quantity so source unit (F vs C vs K) is preserved.
  openddil.common.v1.Quantity component_temperature = 1;   // primary monitored component
  openddil.common.v1.Quantity ambient_temperature = 2;
  openddil.common.v1.Quantity coolant_temperature = 3;
  openddil.common.v1.Quantity exhaust_temperature = 4;

  // Map for additional named thermal sensors. Key = sensor identifier.
  // Value carries its own unit, so heterogeneous probes coexist.
  map<string, openddil.common.v1.Quantity> additional_probes = 10;
}

message PowerMetrics {
  openddil.common.v1.Quantity bus_voltage = 1;       // typical: "V"
  openddil.common.v1.Quantity bus_current = 2;       // typical: "A"
  openddil.common.v1.Quantity battery_state_of_charge = 3;  // "%"
  openddil.common.v1.Quantity battery_state_of_health = 4;  // "%"
  openddil.common.v1.Quantity generator_load = 5;    // "%" or "kW"
  uint32 power_cycles = 6;
}

message FluidMetrics {
  openddil.common.v1.Quantity fuel_remaining = 1;       // "L", "gal_us", "kg" — UCUM
  openddil.common.v1.Quantity fuel_flow_rate = 2;       // "L/h", "kg/h"
  openddil.common.v1.Quantity oil_pressure = 3;         // "kPa", "psi"
  openddil.common.v1.Quantity oil_level = 4;            // "%" or volume
  openddil.common.v1.Quantity hydraulic_pressure = 5;
}

message ConsumablesMetrics {
  // Ammunition, countermeasures, expendables. Free-form keyed map
  // because inventory varies by platform type.
  map<string, ConsumableState> items = 1;
}

message ConsumableState {
  uint32 quantity_remaining = 1;
  uint32 quantity_capacity = 2;
  string nsn = 3;                   // National Stock Number, if applicable
}

message ComponentWearMetrics {
  // Cumulative operational metrics that drive predictive maintenance.
  // Named map because component set is platform-specific.
  map<string, WearState> components = 1;
}

message WearState {
  openddil.common.v1.Quantity hours_in_service = 1;        // "h"
  openddil.common.v1.Quantity cycles = 2;                  // "1"
  openddil.common.v1.Quantity remaining_useful_life = 3;   // "h" or "%"
  WearStatus status = 4;
}

enum WearStatus {
  WEAR_UNSPECIFIED = 0;
  WEAR_NOMINAL = 1;
  WEAR_DEGRADED = 2;
  WEAR_SERVICE_DUE = 3;
  WEAR_CRITICAL = 4;
}

message HealthFlags {
  bool engine_warning = 1;
  bool transmission_warning = 2;
  bool electrical_fault = 3;
  bool comms_fault = 4;
  bool weapons_fault = 5;
  // Unstructured fault codes from BIT (Built-In Test).
  repeated string active_fault_codes = 10;
}

// =============================================================================
// IDENTITY & CLASSIFICATION
// =============================================================================

message AssetIdentity {
  // Stable canonical ID assigned by OpenDDIL. UUID or URN preferred.
  string asset_id = 1;

  // DIS triplet, if sourced from a DIS feed. Optional.
  DisEntityId dis_entity_id = 2;

  // Human-readable callsign / marking. Optional.
  string callsign = 3;

  // Platform classification (e.g., M1A2, F-16C, MQ-9). Free-form.
  string platform_type = 4;

  ForceAffiliation force = 5;

  // CM enrichment fields — populated by the DIS ontology lookup in Bloblang.
  // Fields 1-5 are stable; do not renumber. New fields start at 6.
  DisEntityType dis_entity_type = 6;  // Full 7-tuple entity type (SISO-REF-010)
  string platform_variant       = 7;  // e.g., "M1A2-SEPv3" (from ontology)
  string configuration_baseline = 8;  // e.g., "M1A2-SEPv3-Baseline-2024.2"
  string cbm_schema             = 9;  // e.g., "abrams-canbus-v3"
  string domain_authority       = 10; // e.g., "TACOM", "AMCOM", "JPO"
}

// The DIS EntityType 7-tuple per IEEE 1278.1 / SISO-REF-010.
// All fields default to zero (unspecified). Source: DIS PDU EntityType field.
message DisEntityType {
  uint32 kind        = 1;
  uint32 domain      = 2;
  uint32 country     = 3;
  uint32 category    = 4;
  uint32 subcategory = 5;
  uint32 specific    = 6;
  uint32 extra       = 7;
}

message DisEntityId {
  uint32 site        = 1;
  uint32 application = 2;
  uint32 entity      = 3;
}

enum ForceAffiliation {
  FORCE_UNSPECIFIED = 0;
  FORCE_FRIENDLY = 1;
  FORCE_OPPOSING = 2;
  FORCE_NEUTRAL = 3;
  FORCE_UNKNOWN = 4;
}

// =============================================================================
// PROVENANCE — non-negotiable for any defense system
// =============================================================================

message Provenance {
  // The system that produced this event (e.g., "vrforces-bridge-01").
  string producer_id = 1;

  // The original protocol/source (e.g., "DIS/IEEE-1278.1", "MAVLink", "STANAG-4586").
  string source_protocol = 2;

  // Monotonic source sequence number, if available. Helps detect drops.
  uint64 source_sequence = 3;

  // When the sensor sampled the value (best available estimate).
  google.protobuf.Timestamp sample_time = 4;

  // When OpenDDIL ingested the event. Set by the Bronze sidecar.
  google.protobuf.Timestamp ingest_time = 5;

  // Classification level for downstream filtering. Application-defined.
  string classification = 6;        // e.g., "U", "CUI", "S//NF"
}

// =============================================================================
// THE EVENT
// =============================================================================

message EntityTelemetryEvent {
  // Globally unique event ID (UUIDv7 recommended for time-orderability).
  string event_id = 1;

  AssetIdentity asset = 2;
  KinematicState kinematics = 3;
  SustainmentMetrics sustainment = 4;
  Provenance provenance = 5;

  // Schema version of THIS message structure. Independent of package version.
  // Increment for additive changes; bump package to v2 for breaking changes.
  uint32 schema_revision = 15;
}
