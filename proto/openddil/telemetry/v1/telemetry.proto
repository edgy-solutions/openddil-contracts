syntax = "proto3";
package openddil.telemetry.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "openddil/common/v1/quantity.proto";

// =============================================================================
// CORE PRIMITIVES — used everywhere
// =============================================================================
//
// Quantity (value + UCUM unit) lives in openddil.common.v1; this package
// uses it via the import above. Field types are fully qualified so the
// resolver finds the import without ambiguity.

// A vector quantity — all components share one unit.
message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
  string unit = 4;
}

// A quaternion. Always dimensionless. Order: (w, x, y, z) with w as scalar.
message Quaternion {
  double w = 1;
  double x = 2;
  double y = 3;
  double z = 4;
}

// =============================================================================
// SPATIAL — position, velocity, attitude with explicit frames
// =============================================================================

// Earth-Centered Earth-Fixed (ECEF / WGS84 ellipsoid).
// Per ADR-0013: components are Quantity-typed; producers tag the unit they
// emit natively (UCUM `"m"` for canonical ECEF) and consumers convert lazily
// via pint. Clean break from the prior `x_m double` bare-field shape.
message EcefPosition {
  openddil.common.v1.Quantity x = 1;
  openddil.common.v1.Quantity y = 2;
  openddil.common.v1.Quantity z = 3;
}

// WGS84 geodetic. Lat/lon as Quantity (typical UCUM `"deg"`), altitude as
// Quantity with reference frame called out separately. Per ADR-0013.
message Wgs84Position {
  openddil.common.v1.Quantity lat = 1;
  openddil.common.v1.Quantity lon = 2;
  openddil.common.v1.Quantity alt = 3;
  AltitudeReference alt_ref = 4;
}

enum AltitudeReference {
  ALT_REF_UNSPECIFIED = 0;
  ALT_REF_WGS84_ELLIPSOID = 1;  // height above ellipsoid (HAE)
  ALT_REF_MSL_EGM2008 = 2;      // mean sea level via EGM2008 geoid
  ALT_REF_MSL_EGM96 = 3;
  ALT_REF_AGL = 4;              // above ground level (requires DEM)
  ALT_REF_BAROMETRIC = 5;       // pressure altitude, uncorrected
}

// Local tangent plane: East-North-Up. Components are Quantity-typed per
// ADR-0013 (typical UCUM `"m"`).
message LocalEnu {
  openddil.common.v1.Quantity east = 1;
  openddil.common.v1.Quantity north = 2;
  openddil.common.v1.Quantity up = 3;
  Wgs84Position origin = 4;
}

// Discriminated position. Producers SHOULD emit the frame native to the
// source; consumers convert lazily.
message Position {
  oneof frame {
    EcefPosition ecef = 1;
    Wgs84Position wgs84 = 2;
    LocalEnu local_enu = 3;
  }
  google.protobuf.Timestamp valid_at = 10;
  PositionQuality quality = 11;
}

message PositionQuality {
  // Horizontal/vertical 1-sigma uncertainty in meters. 0 = unknown.
  double horiz_std_m = 1;
  double vert_std_m = 2;
  PositionSource source = 3;
}

enum PositionSource {
  POS_SRC_UNSPECIFIED = 0;
  POS_SRC_GPS_L1 = 1;
  POS_SRC_GPS_RTK = 2;
  POS_SRC_GPS_PPP = 3;
  POS_SRC_INS = 4;          // pure inertial
  POS_SRC_GPS_INS = 5;      // tightly-coupled
  POS_SRC_DEAD_RECKON = 6;
  POS_SRC_OPERATOR = 7;     // human-entered
  POS_SRC_SIMULATED = 8;
}

// Velocity in a named frame. Convert lazily.
message Velocity {
  oneof frame {
    Vector3 ecef = 1;       // m/s in ECEF
    Vector3 ned = 2;        // m/s in local North-East-Down
    Vector3 body = 3;       // m/s in vehicle body frame
  }
  openddil.common.v1.Quantity ground_speed = 10;     // optional convenience scalar
  openddil.common.v1.Quantity course_over_ground = 11;  // bearing, "deg"
}

// Attitude — orientation of the platform body relative to a reference frame.
message Attitude {
  oneof representation {
    Quaternion quat = 1;            // body-to-NED by default
    EulerAngles euler = 2;
  }
  AttitudeReference reference = 10;
  // Per-axis 1-sigma uncertainty in degrees.
  Vector3 std_dev_deg = 11;
}

// Convention: ZYX intrinsic (yaw, pitch, roll). Per ADR-0013, each angle is
// Quantity-typed so the source's native unit (DIS emits `"rad"`; many UI
// systems emit `"deg"`) is preserved on the wire.
message EulerAngles {
  openddil.common.v1.Quantity yaw = 1;
  openddil.common.v1.Quantity pitch = 2;
  openddil.common.v1.Quantity roll = 3;
}

enum AttitudeReference {
  ATT_REF_UNSPECIFIED = 0;
  ATT_REF_BODY_TO_NED = 1;
  ATT_REF_BODY_TO_ECEF = 2;
  ATT_REF_BODY_TO_ENU = 3;
}

// =============================================================================
// KINEMATIC STATE — full motion picture for an asset at a moment
// =============================================================================

message KinematicState {
  Position position = 1;
  Velocity velocity = 2;
  Vector3 acceleration = 3;       // optional, m/s^2 in body frame
  Attitude attitude = 4;
  Vector3 angular_velocity = 5;   // optional, rad/s in body frame

  // Dead-reckoning hints from DIS PDU, if applicable.
  DeadReckoning dead_reckoning = 6;
}

message DeadReckoning {
  DeadReckoningAlgorithm algorithm = 1;
  google.protobuf.Duration max_age = 2;  // beyond this, extrapolation invalid
}

enum DeadReckoningAlgorithm {
  DR_UNSPECIFIED = 0;
  DR_STATIC = 1;
  DR_FPW = 2;   // Fixed, Position World
  DR_RPW = 3;   // Rotating, Position World
  DR_RVW = 4;   // Rotating, Velocity World
  DR_FVW = 5;   // Fixed, Velocity World
  DR_FPB = 6;   // Fixed, Position Body
  DR_RPB = 7;
  DR_RVB = 8;
  DR_FVB = 9;
}

// =============================================================================
// SUSTAINMENT — the logistics/maintenance side of the kinetic-logistics bridge
// =============================================================================

// Whether a sustainment value is a MEASURED observation or a DERIVED estimate
// (e.g. produced by the Phase 5 prognostics engine from kinematic history).
// Per ADR-0020 the validation phase distinguishes the two; Phase 5 is
// uniformly DERIVED — there is no measured-sustainment source yet.
enum Origin {
  ORIGIN_UNSPECIFIED = 0;
  ORIGIN_MEASURED    = 1;
  ORIGIN_DERIVED     = 2;
}

// Per-value provenance for a sustainment field. `confidence` is in [0.0, 1.0]
// for DERIVED values; Phase 5 emits a placeholder (0.0) — confidence gets
// real meaning at the validation phase per ADR-0020.
message ValueProvenance {
  Origin origin     = 1;
  float  confidence = 2;
}

message SustainmentMetrics {
  ThermalMetrics thermal = 1;
  PowerMetrics power = 2;
  FluidMetrics fluids = 3;
  ConsumablesMetrics consumables = 4;
  ComponentWearMetrics wear = 5;
  HealthFlags health = 6;

  // Per-value provenance map. Key = sustainment field path (e.g.
  // "wear.track.remaining_useful_life"). Special key "*" means "every
  // sustainment value in this message has this provenance" — Phase 5
  // populates ONLY the wildcard ("message-level") per ADR-0020; per-field
  // entries are forward-looking shape for the validation phase, where an
  // asset may mix MEASURED and DERIVED values. ADR-0013-style "shape it
  // right while it's cheap."
  map<string, ValueProvenance> value_provenance = 7;
}

message ThermalMetrics {
  // Use Quantity so source unit (F vs C vs K) is preserved.
  openddil.common.v1.Quantity component_temperature = 1;   // primary monitored component
  openddil.common.v1.Quantity ambient_temperature = 2;
  openddil.common.v1.Quantity coolant_temperature = 3;
  openddil.common.v1.Quantity exhaust_temperature = 4;

  // Map for additional named thermal sensors. Key = sensor identifier.
  // Value carries its own unit, so heterogeneous probes coexist.
  map<string, openddil.common.v1.Quantity> additional_probes = 10;
}

message PowerMetrics {
  openddil.common.v1.Quantity bus_voltage = 1;       // typical: "V"
  openddil.common.v1.Quantity bus_current = 2;       // typical: "A"
  openddil.common.v1.Quantity battery_state_of_charge = 3;  // "%"
  openddil.common.v1.Quantity battery_state_of_health = 4;  // "%"
  openddil.common.v1.Quantity generator_load = 5;    // "%" or "kW"
  uint32 power_cycles = 6;
}

message FluidMetrics {
  openddil.common.v1.Quantity fuel_remaining = 1;       // "L", "gal_us", "kg" — UCUM
  openddil.common.v1.Quantity fuel_flow_rate = 2;       // "L/h", "kg/h"
  openddil.common.v1.Quantity oil_pressure = 3;         // "kPa", "psi"
  openddil.common.v1.Quantity oil_level = 4;            // "%" or volume
  openddil.common.v1.Quantity hydraulic_pressure = 5;
}

message ConsumablesMetrics {
  // Ammunition, countermeasures, expendables. Free-form keyed map
  // because inventory varies by platform type.
  map<string, ConsumableState> items = 1;
}

message ConsumableState {
  uint32 quantity_remaining = 1;
  uint32 quantity_capacity = 2;
  string nsn = 3;                   // National Stock Number, if applicable
}

message ComponentWearMetrics {
  // Cumulative operational metrics that drive predictive maintenance.
  // Named map because component set is platform-specific.
  map<string, WearState> components = 1;
}

message WearState {
  openddil.common.v1.Quantity hours_in_service = 1;        // "h"
  openddil.common.v1.Quantity cycles = 2;                  // "1"
  openddil.common.v1.Quantity remaining_useful_life = 3;   // "h" or "%"
  WearStatus status = 4;
}

enum WearStatus {
  WEAR_UNSPECIFIED = 0;
  WEAR_NOMINAL = 1;
  WEAR_DEGRADED = 2;
  WEAR_SERVICE_DUE = 3;
  WEAR_CRITICAL = 4;
}

message HealthFlags {
  bool engine_warning = 1;
  bool transmission_warning = 2;
  bool electrical_fault = 3;
  bool comms_fault = 4;
  bool weapons_fault = 5;
  // Unstructured fault codes from BIT (Built-In Test).
  repeated string active_fault_codes = 10;
}

// =============================================================================
// IDENTITY & CLASSIFICATION
// =============================================================================

message AssetIdentity {
  // Stable canonical ID assigned by OpenDDIL. UUID or URN preferred.
  string asset_id = 1;

  // DIS triplet, if sourced from a DIS feed. Optional.
  DisEntityId dis_entity_id = 2;

  // Human-readable callsign / marking. Optional.
  string callsign = 3;

  // Platform classification (e.g., M1A2, F-16C, MQ-9). Free-form.
  string platform_type = 4;

  ForceAffiliation force = 5;

  // CM enrichment fields — populated by the DIS ontology lookup in Bloblang.
  // Fields 1-5 are stable; do not renumber. New fields start at 6.
  DisEntityType dis_entity_type = 6;  // Full 7-tuple entity type (SISO-REF-010)
  string platform_variant       = 7;  // e.g., "M1A2-SEPv3" (from ontology)
  string configuration_baseline = 8;  // e.g., "M1A2-SEPv3-Baseline-2024.2"
  string cbm_schema             = 9;  // e.g., "abrams-canbus-v3"
  string domain_authority       = 10; // e.g., "TACOM", "AMCOM", "JPO"
}

// The DIS EntityType 7-tuple per IEEE 1278.1 / SISO-REF-010.
// All fields default to zero (unspecified). Source: DIS PDU EntityType field.
message DisEntityType {
  uint32 kind        = 1;
  uint32 domain      = 2;
  uint32 country     = 3;
  uint32 category    = 4;
  uint32 subcategory = 5;
  uint32 specific    = 6;
  uint32 extra       = 7;
}

message DisEntityId {
  uint32 site        = 1;
  uint32 application = 2;
  uint32 entity      = 3;
}

enum ForceAffiliation {
  FORCE_UNSPECIFIED = 0;
  FORCE_FRIENDLY = 1;
  FORCE_OPPOSING = 2;
  FORCE_NEUTRAL = 3;
  FORCE_UNKNOWN = 4;
}

// =============================================================================
// PROVENANCE — non-negotiable for any defense system
// =============================================================================

message Provenance {
  // The system that produced this event (e.g., "vrforces-bridge-01").
  string producer_id = 1;

  // The original protocol/source (e.g., "DIS/IEEE-1278.1", "MAVLink", "STANAG-4586").
  string source_protocol = 2;

  // Monotonic source sequence number, if available. Helps detect drops.
  uint64 source_sequence = 3;

  // When the sensor sampled the value (best available estimate).
  google.protobuf.Timestamp sample_time = 4;

  // When OpenDDIL ingested the event. Set by the Bronze sidecar.
  google.protobuf.Timestamp ingest_time = 5;

  // Classification level for downstream filtering. Application-defined.
  string classification = 6;        // e.g., "U", "CUI", "S//NF"

  // Origin-node provenance (ADR-0022 / ADR-0023). Stamped at the earliest
  // tier in the pipeline that knows where the event physically came from:
  // sensor-ingest for DIS, AMQP connectors for sim-a/proprietary, the
  // faust-regional aggregator for rolled-up events. Values are assigned
  // by the deployer (OPENDDIL_EDGE_ID / OPENDDIL_REGION_ID env-vars; no
  // OpenDDIL-imposed namespace — see ADR-0023 §Topology). Phase 6a
  // populates these for raw-sensor-stream only; cm-state / logistics /
  // window emitters get coordinated upgrades in 6b. Consumers that
  // receive an unstamped message fall back to the projector's env
  // defaults — see openddil-projector/src/handlers/telemetry_latest.py.
  string edge_id = 7;
  string region_id = 8;
}

// =============================================================================
// OPERATIONAL STATE — orthogonal posture axes for any entity
// =============================================================================
//
// Where SustainmentMetrics answers "does this entity have the consumables /
// component-wear margin to keep operating?", OperationalState answers "is
// this entity functional, what is it doing right now, and how healthy is
// it?" Three orthogonal axes — an entity may be POWER_ON + MODE_ACTIVE +
// HEALTH_DEGRADED simultaneously (operating with caveats — the most common
// non-nominal state in practice).
//
// Designed to be a generic intersection of how multiple simulation and
// real-feed sources represent entity state:
//   * DIS (IEEE 1278) EntityState `appearance` bits + EmissionSystem
//     system_status -> map to power_state + health_state + actively_*
//   * AFSim (AFRL) platform.is_on() + sensor.mode() + damage -> all 3 axes
//   * VRForces (MAK) entity damage states + behaviors -> power + health
//   * Proprietary sensor feeds emitting a single combined-state enum (OFF /
//     STANDBY / OPERATE / OPERATE_RX_ONLY / DEGRADED / SHUTDOWN / etc.) ->
//     decomposed into the 3 axes by their ingest mapping
//
// Producers populate whichever axes their wire shape carries; consumers
// MUST tolerate any axis being UNSPECIFIED (proto3 zero). Severity rules
// in logistics-fusion fire on transitions into non-NOMINAL on any axis.

message OperationalState {
  // Coarse "is this entity functional?" axis. The minimum every source
  // can populate. Mobile platforms typically just have OFF/ON; stationary
  // emitters add STANDBY/MAINTENANCE/SHUTTING_DOWN nuances.
  PowerState power_state = 1;

  // Optional finer "what is this entity doing right now?" axis. Sensors
  // and emitters use it to distinguish IDLE vs ACTIVE vs RX/TX-only vs
  // SCAN/TRACK postures. Most mobile platforms leave UNSPECIFIED — their
  // "mode" is implicit in being powered on.
  FunctionalMode functional_mode = 2;

  // Orthogonal "how healthy is this entity?" axis. Independent of power
  // and mode — a radar can be POWER_ON + MODE_ACTIVE + HEALTH_DEGRADED
  // (still doing its job with a redundant-component failure).
  HealthState health_state = 3;

  // Discrete-path activity cues, populated by entities with explicit RX/TX
  // paths (radars, ECM, transponders, datalinks). NOT mutually exclusive
  // with functional_mode — a search-while-track radar may have
  // mode=ACTIVE with both flags true. Mobile platforms / facilities leave
  // nil. Provides finer-grained visibility for the maintainer-view
  // operational diagnostics panel without forcing every consumer to track
  // separate IDLE / SCAN / TRACK modes.
  bool actively_receiving = 4;
  bool actively_transmitting = 5;
}

// =============================================================================
// WHAT *_UNSPECIFIED MEANS ON THESE AXES — ADR-0026 §Amendment 2026-08-18
// =============================================================================
// Stated here, next to the type, because both consumers import this file and
// neither could see the other's choice: logistics-fusion and logistics-sim
// independently arrived at the SAME wrong default, and one of them wrote it
// down approvingly. A convention that is not stated where consumers cite it
// does not govern them — it gets re-derived, the same wrong way, because
// "treat silence as fine" is the branch the language makes free.
//
//   UNSPECIFIED means THE SOURCE MADE NO CLAIM. It is not a value on the
//   axis; it is the absence of one.
//
//   1. It never becomes a ConstrainingFactor. Absence does not constrain the
//      ASSET, it constrains our KNOWLEDGE of the asset.
//   2. It never folds into an operational category — not NOMINAL, not FAULT,
//      not DEGRADED, not any future member. Each is a claim about equipment
//      and there is no claim to make.
//   3. A consumer that cannot express "no claim" must not invent one.
//   4. NOMINAL is a POSITIVE ASSERTION and must be reached deliberately,
//      never by falling through every other branch. A code path where
//      absence and health share an exit is the defect this convention names.
//
// Clause 2 is not a preference. On 2026-06-24 a live feed left
// operational_state absent; proto3 gives an unset enum the zero value and
// unset bools false, so a rule scoring UNSPECIFIED-plus-quiet as FAULT
// matched EVERY asset and the whole fleet lit up. It was backed out. What
// failed was CONFLATION, not distinction — routing absence into an existing
// operational meaning an operator reads as "impaired."
//
// Note the proto3 constraint that makes this a convention rather than a type:
// an unset enum is indistinguishable from an explicitly-set zero on the wire.
// UNSPECIFIED is therefore the only absence signal these axes have, which is
// exactly why it must not be spent on an operational meaning.
// =============================================================================

// PowerState — coarse availability. Every operational source can populate
// at least this axis.
enum PowerState {
  POWER_STATE_UNSPECIFIED = 0;

  // Powered off (commanded or unpowered). Entity contributes nothing.
  POWER_STATE_OFF = 1;

  // Powered on and available. The plain "it works" baseline.
  POWER_STATE_ON = 2;

  // Initialized and ready to transition to ON. Reserved-state for systems
  // that draw a distinction between "warm-but-idle" and "actively serving."
  POWER_STATE_STANDBY = 3;

  // Intentionally unavailable for a scheduled service window. Differs
  // from OFF: maintenance is a planned, time-bounded state.
  POWER_STATE_MAINTENANCE = 4;

  // Executing the shutdown procedure or has completed it. Transient.
  POWER_STATE_SHUTTING_DOWN = 5;
}

// FunctionalMode — finer "what is the entity doing?" axis. Optional;
// entities without mode discrimination leave UNSPECIFIED and consumers
// treat their POWER_STATE_ON as implicitly active.
enum FunctionalMode {
  FUNCTIONAL_MODE_UNSPECIFIED = 0;

  // Powered on but not actively performing its mission. Common idle
  // posture for sensors / emitters between scan windows.
  FUNCTIONAL_MODE_IDLE = 1;

  // Performing its enabled capabilities (full RX + TX where applicable).
  FUNCTIONAL_MODE_ACTIVE = 2;

  // Receiving only — listening without radiating. Stealth/passive
  // posture for radars and ECM. Operator choice, not a fault.
  FUNCTIONAL_MODE_RECEIVE_ONLY = 3;

  // Transmitting only — radiating without receiving. Calibration /
  // beacon mode for transponders. Operator choice, not a fault.
  FUNCTIONAL_MODE_TRANSMIT_ONLY = 4;

  // Sensor sweep mode — actively scanning for new tracks.
  FUNCTIONAL_MODE_SCAN = 5;

  // Sensor track mode — locked on a specific track. Different from SCAN.
  FUNCTIONAL_MODE_TRACK = 6;
}

// HealthState — orthogonal health axis. Logistics-fusion's
// _eval_operational_state maps this to severity:
//   FAILED          -> LOGISTICS_SEVERITY_CRITICAL (operational.failed)
//   FAULT           -> LOGISTICS_SEVERITY_CRITICAL (operational.fault)
//   DEGRADED        -> LOGISTICS_SEVERITY_DEGRADED (operational.degraded)
//   NOMINAL         -> LOGISTICS_SEVERITY_OK
//   UNSPECIFIED     -> no factor emitted (no claim)
// Combined with PowerState rules (OFF/SHUTTING_DOWN/MAINTENANCE) for the
// full severity picture.
enum HealthState {
  HEALTH_STATE_UNSPECIFIED = 0;

  // No detected anomalies. The healthy baseline.
  HEALTH_STATE_NOMINAL = 1;

  // Non-critical anomaly limiting capability. Entity continues to perform
  // at least part of its mission. Examples: redundant component failure
  // while primary remains operational; quality-of-service decline; discrete
  // mismatch; subset of components failed but functionality available.
  HEALTH_STATE_DEGRADED = 2;

  // Active fault detected. Entity may continue operating but requires
  // attention. Distinct from DEGRADED in implying a specific fault code,
  // not just reduced capability.
  HEALTH_STATE_FAULT = 3;

  // Hard failure. Entity cannot operate; requires service. Distinct from
  // PowerState.OFF: OFF is "commanded down," FAILED is "broken and can't
  // come up."
  HEALTH_STATE_FAILED = 4;
}

// =============================================================================
// THE EVENT
// =============================================================================

message EntityTelemetryEvent {
  // Globally unique event ID (UUIDv7 recommended for time-orderability).
  string event_id = 1;

  AssetIdentity asset = 2;
  KinematicState kinematics = 3;
  SustainmentMetrics sustainment = 4;
  Provenance provenance = 5;

  // Operational state for stationary infrastructure (sensors, facilities,
  // fixed launchers). Mobile-asset feeds (DIS, sim-a) leave this nil.
  // See OperationalState above.
  OperationalState operational_state = 6;

  // Schema version of THIS message structure. Independent of package version.
  // Increment for additive changes; bump package to v2 for breaking changes.
  uint32 schema_revision = 15;
}
