# =============================================================================
# OpenDDIL DIS Entity Type Ontology
# =============================================================================
# Maps a DIS EntityType 7-tuple (kind.domain.country.category.subcategory.specific.extra)
# to an OpenDDIL canonical platform descriptor.
#
# KEY FORMAT: "kind_domain_country_category_subcategory_specific_extra"
#   per SISO-REF-010 (Enumerations for Simulation Interoperability)
#
# EVERY KEY IS LOOKED UP, NOT RECALLED. Each entry carries `siso_description`:
# the exact description SISO-REF-010-v37 gives that 7-tuple. CI
# (scripts/check-ontology-siso.py) fetches the v37 XML at a pinned commit and
# fails if any key is absent from the Entity Types table or if its
# description differs from `siso_description`. A tuple that exists in SISO
# under a different name is a mislabel, not a match -- that is what the
# description comparison is for.
#
# `platform_variant` may be finer than SISO (a block or version SISO does not
# enumerate). The key is then the closest SISO entry that names the platform,
# and the extra precision is ours, not the wire's.
#
# CURATION RULES (treat this file as code):
#   - All changes require a PR with a domain expert reviewer.
#   - A new entry needs its tuple AND its siso_description copied from the
#     SISO-REF-010 release named in siso_ref; the CI check enforces both.
#   - A platform with no SISO-REF-010 entry is not given a key here. A
#     locally defined tuple is deployment data: the simulator side is the
#     dis-sim enumeration overlay (DIS_ENTITY_TYPES_PATH), the resolving side
#     the deployment's ontology overlay. See FOLLOW-UPS.md "RCV-M stays
#     unmapped".
#   - More than one key may map to the same platform_variant when SISO
#     enumerates one airframe twice (MQ-9A: Reaper and Predator B).
#   - The `_default` entry must always be present and must not be removed.
#   - cbm_schema and default_baseline may be null for platforms not yet onboarded.
#
# Country codes (selected, per SISO-REF-010-v37 enum 29):
#   225 = United States of America
#   224 = United Kingdom
#   39  = Canada
#
# =============================================================================

