  # ===========================================================================
  # _default — MUST NOT BE REMOVED
  # ===========================================================================
  # When the incoming DIS triple does not match any entry above, this entry
  # is applied. The asset is passed through with UNKNOWN platform metadata
  # and flagged for ontology curation review.
  # ===========================================================================

  "_default":
    platform_variant: "UNKNOWN"
    platform_family: "UNKNOWN"
    nomenclature: "Unrecognized DIS entity type — requires ontology curation"
    # null, not a schema name. This field previously read "generic-v1" — a
    # value that existed nowhere else in the codebase, defined by nothing and
    # resolved by nothing, sitting among six siblings that correctly declare
    # ignorance (two UNKNOWN, three null, a nomenclature that says so
    # outright). A fallback yielding UNKNOWN is honest; one yielding a
    # real-looking name is a confabulation the next reader inherits as
    # intentional. Harmless while nothing consumed the field; changed before
    # anything did.
    cm_schema: null
    default_baseline: null
    cbm_schema: null
    domain_authority: null
    handling: "log_and_pass"
