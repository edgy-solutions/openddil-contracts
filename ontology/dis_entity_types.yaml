# =============================================================================
# OpenDDIL DIS Entity Type Ontology
# =============================================================================
# Maps a DIS EntityType 7-tuple (kind.domain.country.category.subcategory.specific.extra)
# to an OpenDDIL canonical platform descriptor.
#
# KEY FORMAT: "kind.domain.country.category.subcategory.specific.extra"
#   per SISO-REF-010 (DIS Enumerations for Exercises and Training)
#
# IMPORTANT: The triplet values below are illustrative and structurally correct
# per SISO-REF-010 conventions. They MUST be verified against the current
# SISO-REF-010 publication before use against a live DIS network.
#
# CURATION RULES (treat this file as code):
#   - All changes require a PR with a domain expert reviewer.
#   - Do not add entries without a verified SISO-REF-010 source citation.
#   - The `_default` entry must always be present and must not be removed.
#   - cbm_schema and default_baseline may be null for platforms not yet onboarded.
#
# Country codes (selected, per SISO-REF-010):
#   225 = United States of America
#   78  = Canada
#   71  = United Kingdom
#
# =============================================================================

