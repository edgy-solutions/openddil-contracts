# =============================================================================
# Closure reasons: why a failure episode closed (ADR-0059 §4.1, §4.4)
# =============================================================================
# STATUS: PROPOSED 2026-11-14. Provisional. Nothing reads this file yet. It is
# drafted so that the maintenance action record's completion contract can cite
# it by name, and no outcome field is bound to it until that contract is merged.
#
# A closure reason says what the maintenance that answered an episode found.
# The built-in test counts (ADR-0059 §4.1) and the remaining-life scoring
# (DESIGN-2026-11-11-remaining-life-output-kind §5.2) are read from it, so the
# values are declared here, once, rather than in a service.
#
# WHO SETS IT
#   - A confirmed closure carries its reason in the completed work order's
#     outcome, which returns through iagent (ADR-0059 §4.4). Only those
#     closures count as `confirmed`.
#   - A closure recorded at a tier, by a person or a workflow step, is
#     declared-local and unconfirmed. It carries a reason from this list too,
#     is counted under that reason, and is never counted as confirmed.
#
# CLOSED VOCABULARY
#   Counts are summed at each tier and composed up the tiers (ADR-0059 §4.1),
#   so a reason must mean the same thing at every tier and in every deployment.
#   A deployment does not add values. It maps its maintenance system's codes to
#   these in its own bundle. Adding a reason is an amendment to this contract,
#   never a local extension. A code with no mapping is refused at intake with
#   its code named. It is never given a default reason.
#
# NOT A CLOSURE
#   A cancelled or deferred work order closes nothing and carries no reason
#   from this list. iagent's architect answered on 2026-11-14 (provisional
#   until checked) that it still returns a completion record, whose outcome
#   says cancelled or deferred and which closes nothing.
#
# CURATION RULES (treat this file as code):
#   - Changes require a PR with a domain expert reviewer.
#   - A change to `confirms_failure`, `ends_life`, `censors_life`,
#     `in_reliability` or `in_bit_counts` changes every count and score read
#     from it. It needs its own decision record.
#
# FIELDS
#   meaning          what a maintainer found, in one sentence
#   confirms_failure true only for a verified failure. Read by §4.1's
#                    confirmed counts and by the remaining-life join
#   ends_life        whether the closure ends the confirmed component's life
#                    as a failure, for remaining-life scoring
#   censors_life     whether the closure censors the component's life for
#                    remaining-life scoring: an output computed before it,
#                    with no confirmed failure between, is censored at the
#                    closure and never scored as right or wrong. Never true
#                    with ends_life. What follows the closure is the repair's
#                    to decide (repair_types.yaml), as for any repair
#   in_reliability   whether the closure enters §4.1's reliability counts and
#                    rates: confirmed failures, closures by reason as a
#                    denominator, and the no-fault-found rate. False only for
#                    a closure whose cause is outside the component's
#                    reliability. Such a closure is still counted, under its
#                    own reason, and reported as excluded
#   in_bit_counts    whether the episode enters §4.1's built-in test counts:
#                    detection, isolation and the indications not confirmed.
#                    False means a built-in test indication closed under this
#                    reason is neither a detection nor a false alarm
#   candidate        true for a value proposed but off unless a deployment
#                    switches it on in its bundle
#   basis            where the term comes from, and what was read
# =============================================================================

reasons:
  confirmed:
    meaning: The reported failure was verified on the confirmed component.
    confirms_failure: true
    ends_life: true
    censors_life: false
    in_reliability: true
    in_bit_counts: true
    candidate: false
    basis: >-
      MIL-HDBK-2155 failure verification: a reported failure is "verified as
      actual or an explanation provided for lack of verification" (ADR-0059 §4.1).

  no_fault_found:
    meaning: The indication was examined and no failure was found on any candidate component.
    confirms_failure: false
    ends_life: false
    censors_life: false
    in_reliability: true
    in_bit_counts: true
    candidate: false
    basis: >-
      Not a handbook term. A closure value name aligned to MIL-HDBK-2155's
      "explanation provided for lack of verification" (ADR-0059 §4.1).

  cannot_duplicate:
    meaning: The reported symptom could not be reproduced, so it was neither verified nor ruled out.
    confirms_failure: false
    ends_life: false
    censors_life: false
    in_reliability: true
    in_bit_counts: true
    candidate: false
    basis: >-
      A closure value name. Kept apart from no_fault_found because one says the
      unit was examined and found sound, the other that the symptom was not seen.

  retest_okay:
    meaning: A unit removed at one level of repair was tested at the next and passed.
    confirms_failure: false
    ends_life: false
    censors_life: false
    in_reliability: true
    in_bit_counts: true
    candidate: true
    basis: >-
      MIL-HDBK-2165's "retest okay", for a deployment that repairs at two
      levels (ADR-0059 §4.1). A candidate fourth value, off by default.

  battle_damage:
    meaning: The component was damaged by hostile action, and the damage, not a failure, is what the maintenance answered.
    confirms_failure: false
    ends_life: false
    censors_life: true
    in_reliability: false
    in_bit_counts: false
    candidate: false
    basis: >-
      Added from battle damage assessment and repair (BDAR) on 2026-11-16, on
      the project owner's order. Damage from hostile action says nothing about
      the component's reliability, so it is not a failure and is outside every
      reliability count and rate. It is counted under its own reason and
      reported as excluded. A built-in test indication it closes is neither a
      detection nor a false alarm. Remaining-life outputs computed before it
      are censored at it. No BDAR standard or manual was read for this draft;
      the name and rules are checked against one before any field freezes.
