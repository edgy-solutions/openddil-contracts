# =============================================================================
# Repair types: what was done to a component to close an episode
# =============================================================================
# STATUS: PROPOSED 2026-11-14. Provisional. Nothing reads this file yet. It is
# drafted so that the maintenance action record's completion contract can cite
# it by name, and no outcome field is bound to it until that contract is merged.
#
# Why the outcome needs it: a repair starts a new life for a component only
# when its repair type is declared a renewal for that component (ruled
# 2026-11-12, DESIGN-2026-11-11-remaining-life-output-kind §5.2). The outcome
# must therefore say which repair was done, from a list declared once.
#
# NO TYPE HERE IS A RENEWAL
#   This file names repair types and nothing else. A renewal is declared per
#   variant and component, names its owner, and lives with the deployment's
#   declarations, like the movement deadbands. Renewal applies only to repairs
#   in place. With nothing declared, an in-place repair continues the life and
#   is an event recorded on it.
#
# `replaced` NEEDS NO RENEWAL: IT SWAPS IDENTITIES
#   A replacement swaps identities at a position (ADR-0056). The removed
#   component's life ends there, as a removal: a failure only if the closure is
#   `confirmed`, otherwise censored. The installed component starts its own
#   life under its own identity. Remaining life is keyed on component identity,
#   so `replaced` never takes a renewal declaration, and one naming it is
#   refused.
#
# NO REPAIR
#   An outcome where nothing was done (for example a `no_fault_found` closure,
#   see closure_reasons.yaml) carries no repair type. There is no `none` value.
#
# OPEN TO A DEPLOYMENT'S ADDITIONS, IN-PLACE ONLY
#   A deployment may add in-place types in its own bundle, each with a `kind`
#   of `in_place`. It does not add a `replaced` kind. A type the outcome names
#   that neither file declares is refused at intake with its name. It is never
#   read as a default type.
#
# `temporary` CARRIES THE PERMANENT REPAIR'S DUE DATE
#   Added from battle damage assessment and repair (BDAR) on 2026-11-16, on the
#   project owner's order. A temporary repair restores use for now and is owed
#   a permanent one. An outcome naming `temporary` must carry
#   `permanent_repair_due`, a date. Without it, the outcome is refused at
#   intake with the field named, and no due date is ever defaulted.
#   - `temporary` is never a renewal. A renewal declaration naming it is
#     refused: a temporary repair never starts a new life.
#   - It says how long the repair is meant to hold. The work done on a
#     temporary repair is identified by its repair type plus the work order
#     reference, never by a note (review answer, 2026-11-16).
#   - The permanent repair is tracked as a due item in the maintainer's day
#     (DESIGN-2026-11-10-adr0058-first-increment §5), from a producer that reads
#     temporary repairs and their due dates, alongside modification due dates.
#     Turning a due item into a work order is iagent's (review answer,
#     2026-11-16). The producer is not built, and this file does not name it.
#   No BDAR standard or manual was read for this draft.
#
# NAMES
#   The names are not taken from a standard, because no maintenance-action
#   standard was read for this draft. They are checked against one before any
#   field freezes.
#
# CURATION RULES (treat this file as code):
#   - Changes require a PR with a domain expert reviewer.
#   - Removing or renaming a type orphans every renewal declaration that names
#     it. That needs its own decision record.
#
# FIELDS
#   kind      replaced: the component left the asset and another took its
#             place; in_place: the same component stayed, and work was done on it
#   meaning   what was done, in one sentence
#   requires  the outcome fields an outcome naming this type must carry, each
#             refused at intake by name when absent. Empty for most types
# =============================================================================

types:
  replaced:
    kind: replaced
    meaning: The component was removed and a different one installed in its place.
    requires: []

  subpart_replaced:
    kind: in_place
    meaning: A part within the component was replaced, and the component kept its identity.
    requires: []

  overhauled:
    kind: in_place
    meaning: The component was restored to a specified condition by a declared procedure.
    requires: []

  adjusted:
    kind: in_place
    meaning: The component was adjusted, aligned or calibrated, with no part replaced.
    requires: []

  serviced:
    kind: in_place
    meaning: The component was cleaned, lubricated, re-seated or reloaded, with no part replaced.
    requires: []

  temporary:
    kind: in_place
    meaning: A repair made to restore use for now, which a permanent repair is due to replace by a stated date.
    requires: [permanent_repair_due]
