name: Decision indexes

# Catches index drift in decisions/ — a register ID with no row in
# FOLLOW-UPS.md, a row whose ID no longer exists, or a document missing from
# README.md.
#
# WHY THIS IS CI AND NOT A HABIT. Propagation succeeds toward attention and
# fails away from it, and an index is by definition where attention is not.
# The first run of check 2 found ELEVEN unindexed documents, including the
# two most-cited files in the corpus. Asking for more diligence asks for more
# of the resource whose uneven distribution IS the problem; these checks need
# no judgement and run in under a second.
# See PRINCIPLES.md §"Indexes drift where the work is not".
#
# The logic lives in scripts/check-decision-indexes.sh, deliberately NOT
# inlined here — a copy in the workflow and a copy in the docs are two things
# to keep in sync, which is the drift this job exists to catch.
#
# CROSS-SEAM PINS (2026-11-07). An ADR that cites an iagent record pins the
# iagent commit it read (scripts/check-iagent-citation-pins.sh, run by the
# index check). The index check cannot see the other repo, so the second step
# fetches each pinned sha and checks the cited file exists there. This mirrors
# invincible-agent's reference-ADR pin workflow, which pins this repo.
#
# WHAT KEEPS THE PIN CHECK FROM BEING A DECORATIVE GREEN:
#   * The pin check exits 1 on ZERO Cites lines. An empty list is not a pass.
#   * The index check runs under pipefail with the pin list written to a file,
#     not piped, so a failing check fails the step.
#   * Every line is fetched by sha and FETCH_HEAD must resolve to exactly the
#     pinned sha. Every failure is reported and the job fails after all lines
#     are checked.
#   * Nothing in this workflow is allowed to continue past an error.
#
# Scheduled daily because the cited commit can disappear without a PR here.
# Both repos are public; no token.

on:
  push:
    branches: [main]
    paths:
      - 'decisions/**'
      - 'scripts/check-decision-indexes.sh'
      - 'scripts/check-iagent-citation-pins.sh'
      - '.github/invincible-agent.ref'
      - 'tests/test_iagent_citation_pins.py'
      - '.github/workflows/decision-indexes.yml'
  pull_request:
    paths:
      - 'decisions/**'
      - 'scripts/check-decision-indexes.sh'
      - 'scripts/check-iagent-citation-pins.sh'
      - '.github/invincible-agent.ref'
      - 'tests/test_iagent_citation_pins.py'
      - '.github/workflows/decision-indexes.yml'
  schedule:
    - cron: '29 6 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check decision indexes
        shell: bash
        run: |
          set -euo pipefail
          PINS_OUT="$RUNNER_TEMP/pins.txt" ./scripts/check-decision-indexes.sh
          cat "$RUNNER_TEMP/pins.txt"

      - name: Each cited iagent file exists at the pinned commit
        shell: bash
        run: |
          set -uo pipefail
          if ! grep -q . "$RUNNER_TEMP/pins.txt"; then
            echo "::error::the pin list is empty; an empty list is not a pass"
            exit 1
          fi
          fail=0
          while read -r adr repo sha path; do
            dir="$(mktemp -d)"
            git -C "$dir" init -q
            if ! git -C "$dir" fetch -q --depth=1 "https://github.com/edgy-solutions/${repo}.git" "$sha"; then
              echo "::error::${adr}: cannot fetch ${repo} at ${sha}"
              fail=1; continue
            fi
            got="$(git -C "$dir" rev-parse FETCH_HEAD)"
            if [ "$got" != "$sha" ]; then
              echo "::error::${adr}: fetching ${repo} at ${sha} resolved FETCH_HEAD to ${got}"
              fail=1; continue
            fi
            if ! git -C "$dir" cat-file -e "${sha}:${path}"; then
              echo "::error::${adr}: ${repo} at ${sha} has no file ${path}"
              fail=1; continue
            fi
            echo "ok ${adr} ${repo} ${sha} ${path}"
          done < "$RUNNER_TEMP/pins.txt"
          exit "$fail"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyyaml pytest

      - name: The pin check refuses each defect, and this workflow keeps its shape
        run: pytest -q tests/test_iagent_citation_pins.py
