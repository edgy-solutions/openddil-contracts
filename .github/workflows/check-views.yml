name: check-views

# Builds and checks the architecture views with arch-kit, pinned below to a full
# commit of the kit. The kit's Action runs check_views (all the view rules, plus
# `quotes` against the public sample list and `floor`, the chart's render against
# the capability record), builds the single-file HTML export (Mermaid diagrams drawn
# by mermaid-cli), checks it (check_export: the view count equals check_views', no
# barred value, provenance on every page, no network reference, under 16 MB), drives
# it in a browser, runs the decision-index check, and uploads the export as the
# arch-kit-export artifact, because the portal declares hosting: ci-artifact. The
# export is not committed anywhere. The tests, and a canary (a run that breaks a
# copy of the record and proves quotes and floor can fail), run from the same kit.
#
# The `golden` job builds the same tree with this repository's own old tools and with
# the pinned kit, and compares the two exports element by element. Every difference
# must be named in docs/arch/golden-allow.txt, with a reason, or the job fails; so
# does an allowance that matches nothing.
#
# Am-If's table is built from ontology/, so an ontology change is a reason to
# run too. The floor reads a render of the chart, so the chart changing is a reason to
# run. openddil-helm sends chart-version-bumped when it does. The daily
# schedule is a floor under that dispatch: a dropped or missed dispatch
# still gets caught within a day.
#
# The only secret is the optional relabel list, written to a file for the Action.
# Green here shows the structural checks and the scan's mechanics, and is not evidence
# that any private scan ran: the barred list is the public sample.
on:
  push:
    branches: [main, 'docs/arch-*']
    paths:
      - 'docs/arch/**'
      - 'decisions/**'
      - 'ontology/**'
      - 'scripts/golden*'
      - '.github/workflows/check-views.yml'
  pull_request:
    paths:
      - 'docs/arch/**'
      - 'decisions/**'
      - 'ontology/**'
      - 'scripts/golden*'
      - '.github/workflows/check-views.yml'
  repository_dispatch:
    types: [chart-version-bumped]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Same helm as openddil-helm's chart-checks.yml. Release tarball from get.helm.sh.
  HELM_VERSION: v3.16.2
  HELM_SHA256: 9318379b847e333460d33d291d4c088156299a26cd93d570a7f5d0c36e50b5bb
  # The chart commit this CI reads, pinned so that a chart change cannot turn this repository red
  # by itself. Bumping it refreshes the specimen: run docs/arch/tools/refresh_specimen.py against
  # the new commit and commit the result in the same change.
  HELM_REF: f2c971c6293851520df042aaed54f5db104447bf
  CHART: repos/openddil-helm/openddil-demo
  BUNDLE: repos/openddil-customer-bundle-example
  READINESS: repos/openddil-helm/scripts/RECORDING-READINESS.md

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edgy-solutions/openddil-helm
          ref: ${{ env.HELM_REF }}
          path: repos/openddil-helm

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edgy-solutions/openddil-customer-bundle-example
          ref: master
          path: repos/openddil-customer-bundle-example

      # The kit again, as a directory: the tests find it through ARCH_KIT, and the canary runs from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edgy-solutions/arch-kit
          ref: 2ae4bf8de2e4818a9a186fb8cc0a5311b2ad0f7b # phase1 S6d
          path: arch-kit

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - run: pip install ./arch-kit

      - name: Install helm at its pinned version and check its hash
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/helm.tar.gz" \
            "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
          echo "$HELM_SHA256  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/helm"
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP/helm" --strip-components=1 linux-amd64/helm
          echo "$RUNNER_TEMP/helm" >> "$GITHUB_PATH"

      # A skipped specimen test means a sibling was not found. In CI that is
      # not a pass.
      - name: Tests
        run: |
          set +e
          ARCH_KIT="$PWD/arch-kit" OPENDDIL_REPOS="$PWD/repos" OPENDDIL_BUNDLE="$PWD/$BUNDLE" \
            python -m unittest discover -s docs/arch/tools -p 'test_*.py' > "$RUNNER_TEMP/tests.log" 2>&1
          rc=$?
          set -e
          tail -n 8 "$RUNNER_TEMP/tests.log"
          if [ "$rc" != 0 ]; then exit "$rc"; fi
          if grep -q 'skipped=' "$RUNNER_TEMP/tests.log"; then
            echo "tests: some were skipped; in CI a skipped test is not a pass"
            exit 1
          fi

      - name: Canary (quotes and floor must fail when the copy is broken)
        run: |
          arch-kit --config docs/arch/arch-kit.yaml check_views_canary \
            --chart "$CHART" \
            --values "$BUNDLE/k8s/tier-node-values.yaml" \
            --values "$BUNDLE/k8s/egress-values.yaml" \
            --release openddil \
            --readiness "$READINESS" \
            --barred docs/arch/tools/barred-sample.txt

      - name: Relabel list
        env:
          RELABEL: ${{ secrets.ARCH_RELABEL }}
        run: |
          if [ -n "$RELABEL" ]; then printf '%s\n' "$RELABEL" > "$RUNNER_TEMP/relabel.txt"; echo "relabel: repository secret"
          else cp docs/arch/tools/relabel-sample.txt "$RUNNER_TEMP/relabel.txt"; echo "relabel: sample list only"; fi

      # Check the views, build and check the export, check it in a browser, check the decision
      # indexes, and upload the export (the portal declares hosting: ci-artifact).
      - name: Build and check with arch-kit
        uses: edgy-solutions/arch-kit@2ae4bf8de2e4818a9a186fb8cc0a5311b2ad0f7b # phase1 S6d
        with:
          config: docs/arch/arch-kit.yaml
          chart: ${{ env.CHART }}
          release: openddil
          values: |
            ${{ env.BUNDLE }}/k8s/tier-node-values.yaml
            ${{ env.BUNDLE }}/k8s/egress-values.yaml
          readiness: ${{ env.READINESS }}
          relabel: ${{ runner.temp }}/relabel.txt
          barred: docs/arch/tools/barred-sample.txt

  # The golden comparison. The old tools are the last tree that had this repository's own: db08b35 on main,
  # the commit before the tools moved to the kit. It is pinned by full sha, not "the base of the branch".
  golden:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: db08b35a1f9475f63f2b0ad9b355268fe91e28e5
          path: old-src
          sparse-checkout: docs/arch/tools

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edgy-solutions/openddil-helm
          ref: ${{ env.HELM_REF }}
          path: repos/openddil-helm

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edgy-solutions/openddil-customer-bundle-example
          ref: master
          path: repos/openddil-customer-bundle-example

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edgy-solutions/arch-kit
          ref: 2ae4bf8de2e4818a9a186fb8cc0a5311b2ad0f7b # phase1 S6d
          path: arch-kit

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # The old tools need the same libraries the kit does.
      - run: pip install ./arch-kit

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install helm at its pinned version and check its hash
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/helm.tar.gz" \
            "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
          echo "$HELM_SHA256  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/helm"
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP/helm" --strip-components=1 linux-amd64/helm
          echo "$RUNNER_TEMP/helm" >> "$GITHUB_PATH"

      - name: Relabel list
        env:
          RELABEL: ${{ secrets.ARCH_RELABEL }}
        run: |
          if [ -n "$RELABEL" ]; then printf '%s\n' "$RELABEL" > "$RUNNER_TEMP/relabel.txt"; echo "relabel: repository secret"
          else cp docs/arch/tools/relabel-sample.txt "$RUNNER_TEMP/relabel.txt"; echo "relabel: sample list only"; fi

      # Prints counts and element ids only. A failure names the element, never a value.
      - name: Build with the old tools and with the kit, and compare
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
          CHART: ${{ github.workspace }}/${{ env.CHART }}
          BUNDLE: ${{ github.workspace }}/${{ env.BUNDLE }}
          READINESS: ${{ github.workspace }}/${{ env.READINESS }}
          RELABEL: ${{ runner.temp }}/relabel.txt
          BARRED: ${{ github.workspace }}/docs/arch/tools/barred-sample.txt
        run: |
          scripts/golden.sh "$PWD" old-src/docs/arch/tools arch-kit "$RUNNER_TEMP/golden"
