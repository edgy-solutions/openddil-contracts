name: check-views

# Runs the architecture view checks (docs/arch/tools/check_views.py) in full:
# all thirteen view rules, plus `quotes` (evidence quotes against the barred
# list) and `floor` (the chart's render against the capability record). Then
# a canary run that breaks a copy of the record and proves both can fail.
#
# The floor reads a render of the chart, so the chart changing is a reason to
# run. openddil-helm sends chart-version-bumped when it does. The daily
# schedule is a floor under that dispatch: a dropped or missed dispatch
# still gets caught within a day.
#
# The barred list is a secret, written to a file in RUNNER_TEMP. It is never
# echoed and never on a command line.
on:
  push:
    branches: [main]
    paths:
      - 'docs/arch/**'
      - 'decisions/**'
      - '.github/workflows/check-views.yml'
  pull_request:
    paths:
      - 'docs/arch/**'
      - 'decisions/**'
      - '.github/workflows/check-views.yml'
  repository_dispatch:
    types: [chart-version-bumped]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Same helm as openddil-helm's chart-checks.yml. Release tarball from get.helm.sh.
  HELM_VERSION: v3.16.2
  HELM_SHA256: 9318379b847e333460d33d291d4c088156299a26cd93d570a7f5d0c36e50b5bb
  CHART: repos/openddil-helm/openddil-demo
  BUNDLE: repos/openddil-customer-bundle-example
  READINESS: repos/openddil-helm/scripts/RECORDING-READINESS.md

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: edgy-solutions/openddil-helm
          ref: master
          path: repos/openddil-helm

      - uses: actions/checkout@v4
        with:
          repository: edgy-solutions/openddil-customer-bundle-example
          ref: master
          path: repos/openddil-customer-bundle-example

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyyaml

      - name: Install helm at its pinned version and check its hash
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/helm.tar.gz" \
            "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
          echo "$HELM_SHA256  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/helm"
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP/helm" --strip-components=1 linux-amd64/helm
          echo "$RUNNER_TEMP/helm" >> "$GITHUB_PATH"

      # A skipped specimen test means a sibling was not found. In CI that is
      # not a pass.
      - name: Tests
        run: |
          set +e
          OPENDDIL_REPOS="$PWD/repos" OPENDDIL_BUNDLE="$PWD/$BUNDLE" \
            python -m unittest discover -s docs/arch/tools -p 'test_*.py' > "$RUNNER_TEMP/tests.log" 2>&1
          rc=$?
          set -e
          tail -n 8 "$RUNNER_TEMP/tests.log"
          if [ "$rc" != 0 ]; then exit "$rc"; fi
          if grep -q 'skipped=' "$RUNNER_TEMP/tests.log"; then
            echo "tests: some were skipped; in CI a skipped test is not a pass"
            exit 1
          fi

      - name: Write the barred list
        env:
          BARRED: ${{ secrets.OPENDDIL_BARRED_VALUES }}
        run: printf '%s\n' "$BARRED" > "$RUNNER_TEMP/barred.txt"

      - name: Check the views
        run: |
          python docs/arch/tools/check_views.py \
            --chart "$CHART" \
            --values "$BUNDLE/k8s/tier-node-values.yaml" \
            --values "$BUNDLE/k8s/egress-values.yaml" \
            --release openddil \
            --readiness "$READINESS" \
            --barred "$RUNNER_TEMP/barred.txt"

      - name: Canary (quotes and floor must fail when the copy is broken)
        run: |
          python docs/arch/tools/check_views_canary.py \
            --chart "$CHART" \
            --values "$BUNDLE/k8s/tier-node-values.yaml" \
            --values "$BUNDLE/k8s/egress-values.yaml" \
            --release openddil \
            --readiness "$READINESS" \
            --barred "$RUNNER_TEMP/barred.txt"
