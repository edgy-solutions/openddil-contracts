name: tests

# Runs the pytest suite in tests/ on every pull request and on main. The
# tests import the generated Python bindings, so the job builds them first
# with `make python`, the same target a developer runs. That also makes
# this the CI proof of the Makefile's copy step (the hand-written ucum.py
# must land in gen/python).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install pyyaml pytest grpcio-tools

      - name: Generate Python bindings
        run: make python PROTOC="python -m grpc_tools.protoc"

      - name: Run tests
        run: python -m pytest -q tests
