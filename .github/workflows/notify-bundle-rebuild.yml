name: Notify openddil-helm to rebuild runtime-bundle

# Fires a repository_dispatch event at openddil-helm whenever something
# changes in this repo on master that could affect the runtime-bundle
# image (proto files, generated bindings, Makefile, ontology). The
# bundle build is otherwise manual (see openddil-helm's build-bundle.yml
# header for the design rationale) and constantly bit us when a contract
# change wasn't followed by a bundle rebuild.
#
# Setup (one-time):
#   1. Create a PAT (fine-grained) with:
#        - Repository access: edgy-solutions/openddil-helm
#        - Repository permissions: Contents = Read and write, Metadata = Read
#      (The PAT needs write on Contents to fire repository_dispatch via the
#      REST POST /repos/{owner}/{repo}/dispatches endpoint.)
#   2. Store it in this repo's secrets as BUNDLE_REBUILD_PAT.
#   3. openddil-helm's build-bundle.yml must include
#      `repository_dispatch: types: [source-repo-changed]` in its on:
#      block (added 2026-05-29 — verify before merging this file).
#
# Paths filter is conservative: we trigger on anything the bundle
# Dockerfile actually COPYs in. If you edit the Dockerfile to include
# additional paths from this repo, extend the paths: list below.

on:
  push:
    # openddil-contracts default branch is `main` (verified 2026-05-29 —
    # contract-injection.yml in this repo also keys on `main`). Other
    # sibling repos use `master`; per-repo branch name is whatever the
    # repo's default actually is, NOT a stack-wide convention.
    branches: [ "main" ]
    paths:
      - "proto/**"
      - "gen/**"
      - "ontology/**"
      - "Makefile"
      - ".github/workflows/notify-bundle-rebuild.yml"
  # Manual button for when you want to force a dispatch without pushing
  # (e.g. testing the wiring, or kicking the bundle build after editing
  # something this paths filter doesn't catch).
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch source-repo-changed to openddil-helm
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.BUNDLE_REBUILD_PAT }}
          repository: ${{ github.repository_owner }}/openddil-helm
          event-type: source-repo-changed
          # Payload is informational — build-bundle.yml doesn't read it
          # today, but it's visible in the Actions logs of the dispatched
          # workflow and useful for debugging "who triggered this rebuild".
          client-payload: |
            {
              "source_repo":  "openddil-contracts",
              "ref":          "${{ github.ref }}",
              "sha":          "${{ github.sha }}",
              "actor":        "${{ github.actor }}",
              "commit_url":   "${{ github.event.head_commit.url }}"
            }
