name: Ontology resolves in SISO

# Every DIS tuple in ontology/dis_entity_types.yaml must exist in the
# SISO-REF-010-v37 Entity Types table AND carry the name SISO gives it.
#
# WHY THIS IS CI. The ontology's first eleven tuples were written from
# recall. All eleven were wrong: seven existed in SISO under a different
# platform's name, four did not exist. Nothing could notice, because the
# pipeline behaves identically for a right tuple and a wrong one, as long as
# the simulator emits the same wrong tuple the ontology maps. Only a real CGF
# would have exposed it, by mislabelling stock traffic.
# See FOLLOW-UPS.md "the ontology's DIS tuples are aligned to SISO-REF-010-v37".
#
# The logic lives in scripts/check-ontology-siso.py, not inlined here.
#
# The second step is the red check, kept permanently: a check that has never
# been seen to fail is not known to check anything. It plants one tuple that
# exists in SISO under another platform's name, and requires the check to
# refuse it.

on:
  push:
    branches: [main]
    paths:
      - 'ontology/dis_entity_types.yaml'
      - 'scripts/check-ontology-siso.py'
      - 'tests/test_ontology.py'
      - '.github/workflows/ontology-siso.yml'
  pull_request:
    paths:
      - 'ontology/dis_entity_types.yaml'
      - 'scripts/check-ontology-siso.py'
      - 'tests/test_ontology.py'
      - '.github/workflows/ontology-siso.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install pyyaml pytest

      - name: Every tuple resolves by name in SISO-REF-010-v37
        run: python scripts/check-ontology-siso.py

      - name: Red check -- a planted mislabel must fail
        run: |
          set -u
          # 1_1_225_1_3_1_0 exists in SISO as the M551A1. Planting it in place
          # of the M1A2 SEP V3 key must be refused on the description check.
          sed 's/"1_1_225_1_1_18_0":/"1_1_225_1_3_1_0":/' \
            ontology/dis_entity_types.yaml > /tmp/planted.yaml
          if ! grep -q '"1_1_225_1_3_1_0":' /tmp/planted.yaml; then
            echo "red check could not plant its tuple -- the key it targets moved"; exit 1
          fi
          if python scripts/check-ontology-siso.py --ontology /tmp/planted.yaml; then
            echo "RED CHECK FAILED: a planted mislabel passed"; exit 1
          fi
          echo "red check: the planted mislabel was refused"

      - name: Ontology structure tests
        run: pytest -q tests/test_ontology.py
